name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Test server
        run: npm test
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
        working-directory: server

  # Render deploys automatically on push to main via GitHub integration.
  # No deploy step needed here — Render watches the repo directly.